[package]
name = "rust_lib_cozysafe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
cs-crypto = { path = "../../core/cs-crypto" }
cs-vault = { path = "../../core/cs-vault" }
cs-photo = { path = "../../core/cs-photo" }
zeroize = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
