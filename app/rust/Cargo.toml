[package]
name = "rust_lib_cozysafe"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
cs-crypto = { path = "../../core/cs-crypto" }
cs-vault = { path = "../../core/cs-vault" }
cs-photo = { path = "../../core/cs-photo" }
cs-net = { path = "../../core/cs-net" }
# QR codes for pairing with a nearby device: draw one, read one from camera frames.
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
zeroize = "1"

# This crate is its own workspace root (the core workspace excludes app/), so the core's
# profile does not reach it. Argon2 is unbearably slow unoptimised: only it and its hash
# are optimised in debug app builds. Not every dependency: optimising all of them inlines
# std's socket code into other crates' generics, and cackle then reports crates other
# than cs-net as using the network API (CI, 2026-10-28).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

