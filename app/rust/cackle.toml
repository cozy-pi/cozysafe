# cackle (cargo-acl) policy for the app's Rust library and everything it links:
# the core crates (core/*), flutter_rust_bridge and their dependencies.
#   cd app/rust && cargo acl --no-ui
# Linux only. See docs/supply-chain.md.
#
# The point is the `net` API: no crate may use it. Never add "net" or
# "unix_sockets" to any allow_apis below; replace the crate instead.
#
# The fs / process / unsafe grants were first written from a scan of each crate's
# sources (generous on purpose). cackle warns about a grant a crate does not use;
# trim those from its output.

[common]
version = 2
import_std = ["fs", "net", "unix_sockets", "process"]

# The same socket calls reached through libc directly instead of std::net.
[api.net]
include = [
    "libc::socket",
    "libc::socketpair",
    "libc::connect",
    "libc::bind",
    "libc::listen",
    "libc::accept",
    "libc::accept4",
    "libc::send",
    "libc::sendto",
    "libc::sendmsg",
    "libc::recv",
    "libc::recvfrom",
    "libc::recvmsg",
    "libc::getaddrinfo",
    "libc::getnameinfo",
    "tokio::net",
]

# Build scripts and proc macros run as in any cargo build: cackle checks what they
# use but does not sandbox them (Bubblewrap needs unprivileged user namespaces,
# which GitHub's Ubuntu runners restrict).
[sandbox]
kind = "Disabled"

[pkg.addr2line]
allow_unsafe = true

[pkg.adler2]
allow_unsafe = true

[pkg."aho-corasick"]
allow_unsafe = true

[pkg."allo-isolate"]
allow_unsafe = true

[pkg.anyhow]
allow_unsafe = true
allow_apis = ["fs"]
build.allow_apis = ["fs", "process"]

