name: cozysafe
description: "Cozy Safe: an open-source encrypted vault for notes, files and photos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  intl: any
  camera: ^0.11.1
  file_selector: ^1.0.3
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  path_provider: 2.1.6
  share_plus: ^13.0.0
  rust_lib_cozysafe:
    path: rust_builder
  pdfrx: ^2.6.6
  video_player: ^2.14.1
  fc_native_video_thumbnail: ^4.0.0
  package_info_plus: ^10.2.2
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only the browser preview (lib/preview_main.dart) fetches sample photos with it;
  # the app itself never uses the network (docs/supply-chain.md).
  http: ^1.6.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
