name: cozysafe
description: "Cozy Safe: an open-source encrypted vault for notes, files and photos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  intl: any
  camera: ^0.11.1
  file_selector: ^1.0.3
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  path_provider: 2.1.6
  share_plus: ^13.0.0
  rust_lib_cozysafe:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
