[[audits.curve25519-dalek]]
who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "5.0.0"
notes = """
Independent audit: Quarkslab for Tari Labs, 2019 (https://blog.quarkslab.com/security-audit-of-dalek-libraries.html), of version 1.2.1 (u64 and avx2 backends, Edwards, Ristretto, Scalar); no critical finding. Four major versions old, so our own review is the evidence for 5.0.0.
Configuration: features digest and zeroize only (no alloc, no precomputed-tables, no rand_core, group, serde, lizard, legacy_compatibility), backend serial: build.rs picks serial on every non-x86_64 target, and .cargo/config.toml forces it on x86_64. 64-bit targets (arm64 phones, Apple Silicon, x86_64) compile the u64 backend; the Play bundle's armeabi-v7a library compiles the u32 backend. Our code reaches the crate only through ed25519-dalek and x25519-dalek: Scalar from_bytes_mod_order, from_canonical_bytes, from_hash, add and mul; EdwardsPoint mul_base, mul_base_clamped, compress, decompress, is_small_order, vartime_double_scalar_mul_basepoint, to_montgomery; MontgomeryPoint mul_clamped; clamp_integer.
Read, every compiled line (test modules and doc comments excepted): lib.rs, macros.rs, traits.rs, constants.rs, window.rs, field.rs, scalar.rs, edwards.rs, edwards/affine.rs, montgomery.rs, ristretto.rs, ristretto/elligator.rs, backend.rs, backend/serial.rs, serial/curve_models.rs, serial/scalar_mul.rs, scalar_mul/variable_base.rs, scalar_mul/vartime_double_base.rs, the u64 backend (field.rs, scalar.rs, constants.rs outside the tables) and the u32 backend (u32.rs, field.rs, scalar.rs, constants.rs outside the tables), build.rs.
Not compiled, not read: backend/vector (AVX2, AVX-512 IFMA), fiat_u32/fiat_u64, lizard, diagnostics.rs (needs a cfg we do not set), the precomputed basepoint tables and AFFINE_ODD_MULTIPLES tables in both constants files, the alloc-only code (straus, precomputed_straus, pippenger, multiscalar impls, batch inversion and batch compression), and the group, serde and rand_core impls.
Arithmetic: u64 field (radix 2^51 mul/square bounds, reduce, sub with 16p, canonical to_bytes, from_bytes ignoring bit 255); u64 scalar (radix 2^52, Montgomery reduce, sub with ct conditional add of l via subtle, the RUSTSEC-2024-0344 fix); u32 field (radix 2^25.5: 19*y and 2*x fit u32 for limbs up to 1.75 excess bits, products below 2^64, reduce carries, add left unreduced and every caller stays inside that headroom, sub and negate with 16p, canonical to_bytes). u32 scalar Scalar29 (9 limbs of 29 bits): the one-level Karatsuba mul_internal and square_internal ported to Python with 64-bit wrapping and checked equal to the schoolbook product on 40,000 inputs including all-ones limbs; non-wrapping sums stay below 2^63 (no overflow seen); montgomery_reduce is correct whenever the product is below l*2^261, which holds for every caller (inputs below 2^256, so unreduced clamped scalars too), worst-case sums 62 bits; mul, from_bytes_wide (incl. 2^512-1), add, sub, reduce and from_montgomery checked against Python big integers. Scalar inversion chain recomputed: exponent l-2. Field invert and pow_p58 chains, sqrt_ratio_i, from_bytes_wide (19 and 722 for the top bits), expand_msg_xmd and hash_to_field per RFC 9380.
Constants recomputed independently for both backends: d, 2d, sqrt(-1), 1-d^2, (d-1)^2, sqrt(ad-1), 1/sqrt(a-d), sqrt(-486664), A, -A, (A+2)/4, -1, l, R (2^260 or 2^261 mod l), R^2, LFACTOR, the basepoint, the eight 8-torsion points ([i]P, order 8), FE_C2 = 2^((p+3)/8); in constants.rs the compressed Ed25519 and Ristretto basepoints, BASEPOINT_ORDER = l and the seven X25519 low-order u values.
Curve code: Edwards decompress, compress, add, sub and double formulas, ct radix-16 window multiply (all 8 table entries scanned with ct_eq; mul_base without tables uses it), vartime double-base (public inputs only), mul_by_pow_2, is_small_order, Montgomery ladder (fixed 255 steps, ct swap, clamping per RFC 7748). Reached by nothing we call: Ristretto decode, encode and Elligator map (checked against RFC 9496), Edwards hash_to_curve and Elligator2 map (RFC 9380 G.2), to_edwards.
Decompression accepts non-canonical y (y >= p) and x = -0, as upstream documents; verify_strict in ed25519-dalek compensates for R, not for the public key (see that entry). Not zeroized: the radix-16 digits of the secret scalar and the ladder state on the stack.
The u32 backend assumes a constant-time 32x32->64 multiply (UMULL on ARMv7-A cores, which is).
No unsafe compiled in this configuration (the one outside backend/vector is behind precomputed-tables). No I/O, no global mutable state, no_std. build.rs runs at build time: reads cargo env vars, asks rustc_version for the compiler version, prints cfgs; no network, no file writes.
RFC 8032 and RFC 7748 vectors run in core/cs-identity/tests/vectors_25519.rs, on the u64 backend and again with --cfg curve25519_dalek_bits="32" (Scalar29 and FieldElement2625 confirmed in the test binary): all pass.
Machine-assisted review of the copy in third_party/rust/ (2026-11-06).
"""

