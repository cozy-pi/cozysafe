[[audits.ed25519-dalek]]
who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
Independent audit: only a brief look at version 1.0.0-pre.1 in the Quarkslab 2019 dalek report (https://blog.quarkslab.com/security-audit-of-dalek-libraries.html); our own review is the evidence for 3.0.0.
Built with feature zeroize only (no fast, batch, digest, hazmat, pkcs8, serde, rand_core): forbid(unsafe_code) applies. Read: signing.rs, verifying.rs, hazmat.rs, signature.rs, errors.rs, constants.rs, lib.rs. batch.rs, context.rs and stream.rs not compiled.
Pure Ed25519 per RFC 8032: SHA-512 of the seed, clamp, reduce mod l; r = H(prefix || M) mod l; S = r + H(R || A || M) a mod l. The public key is fixed at SigningKey construction (no RUSTSEC-2022-0093 oracle). Signature S must be canonical (< l). verify_strict decompresses R, rejects small-order R and A, and compares [S]B - [k]A, recompressed, byte for byte with R, so a non-canonical R never verifies. Not checked by the crate: a non-canonical public key encoding (y >= p) of a large-order point decodes and verifies; nobody knows such a key's secret, and cs-identity hashes the key bytes into the fingerprint and the signed frame, so it only gives a different identity, not a forgery.
Zeroized: the seed (SigningKey drop) and ExpandedSecretKey (scalar and prefix). Not zeroized: the SHA-512 output and copies during key expansion, the nonce r and its hash, left on the stack.
RFC 8032 section 7.1 vectors (all five) and strict-mode rejections run in core/cs-identity/tests/vectors_25519.rs.
Machine-assisted review of the copy in third_party/rust/ (2026-11-06).
"""

