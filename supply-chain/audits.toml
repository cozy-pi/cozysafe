
# cargo-vet audits file

[audits]

[[audits.argon2]]
who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "0.6.0"
notes = """
Every src/ file read. Argon2id v0x13 checked against RFC 9106 (H0 with all length prefixes, H' for T<=64 and T>64, first blocks, data-independent addressing in pass 0 slices 0-1, index selection, BlaMka G, final XOR and H'). Unsafe (block allocation, segment views, AVX2 wrapper behind cpuid) sound. No I/O, no build script. Not wiped by the crate: its working memory (up to 512 MiB) and some stack copies; cs-crypto passes its own memory and wipes it. RFC 9106 vector runs in core/cs-crypto/tests/vectors.rs.
Machine-assisted review of the copy in third_party/rust/ (2026-10-31).
"""

[[audits.blake2]]
who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = """
Blake2b (as used by argon2) read: rounds, IV, sigma, rotations, counter and final flag, output length in the parameter block. One unsafe (repr(C) struct as bytes) sound. No SIMD, no I/O, no build script.
Machine-assisted review of the copy in third_party/rust/ (2026-10-31).
"""

[[audits.sha2]]
who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "0.11.1"
notes = """
SHA-256/512: constants recomputed from prime roots, schedule, compression and padding checked against FIPS 180-4. Unsafe in the SHA-NI, AVX2 and ARMv8 backends in bounds and gated by cpufeatures. Differential test of lengths 0-599 (one-shot and split) against OpenSSL, hardware and soft backends: no mismatch. Low: aarch64 Linux/Android SHA-512 detection accepts SHA3 or SHA512 hwcap; old Apple OSes without the sysctl key would panic on SHA-512 detection. NIST examples run in core/cs-crypto/tests/vectors.rs.
Machine-assisted review of the copy in third_party/rust/ (2026-10-31).
"""

