criteria = "safe-to-deploy"
version = "0.12.0"
notes = """
forbid(unsafe_code). Every src/ file read. SHA3-256 rate 136, output 32; domain byte 0x06 at the cursor position and 0x80 in the last rate byte (XOR, so a full-minus-one block gives 0x86); one permutation then the output read little-endian. Absorbing through sponge-cursor. Serialized state rejects a cursor >= rate. Without its zeroize feature the permuted state (invertible, so it reveals the last absorbed block: the X-Wing combiner input, ML-KEM's G/H input) stays in freed stack memory after finalize; found in this review, cs-identity now turns the feature on, which wipes the state on drop. NIST FIPS 202 examples and CAVP vectors run in core/cs-identity/tests/vectors_keccak.rs.
