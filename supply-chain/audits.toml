who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "0.1.0"
notes = """
Every src/ file read. Absorb: finish the partial block, permute; full blocks XORed little-endian then permuted; tail kept with pos = tail length (a block that fills exactly is permuted at once, so padding goes into a fresh block). Squeeze: pos 0 means permute before reading, partial reads advance pos. 5 unsafe: two unreachable_unchecked on pos < RATE (kept by new() and set_pos's assert), three casts of [u64; N] to a [u8; RATE] prefix (RATE <= 8N asserted at compile time, little-endian only); sound. No I/O, no build script.
Machine-assisted review of the copy in third_party/rust/ (2026-11-06).
"""

[[audits.x25519-dalek]]
who = "Cozy Pi <dev@cozypi.com>"
criteria = "safe-to-deploy"
version = "3.0.0"
notes = """
Independent audit: a brief review of version 0.5.2 in the Quarkslab 2019 dalek report (https://blog.quarkslab.com/security-audit-of-dalek-libraries.html); our own review is the evidence for 3.0.0.
Built with static_secrets and zeroize (no precomputed-tables, getrandom, serde). Both files read; no unsafe. DH is MontgomeryPoint::mul_clamped (RFC 7748 clamping, ladder in curve25519-dalek); the public key is the clamped scalar times the Edwards basepoint, mapped to u. StaticSecret, EphemeralSecret and SharedSecret are zeroized on drop; StaticSecret::to_bytes and From<[u8; 32]> make unzeroized copies (caller's care). No contributory check unless was_contributory is called (X-Wing does not need it). rand_core is a non-optional dependency, used for traits only.
RFC 7748 section 5.2 (two cases, 1 and 1,000 iterations) and section 6.1 vectors run in core/cs-identity/tests/vectors_25519.rs.
Machine-assisted review of the copy in third_party/rust/ (2026-11-06).
"""
