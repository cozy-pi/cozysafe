forbid(unsafe_code). Every src/ file read. Rates 168 (SHAKE128) and 136 (SHAKE256), checked at compile time; domain byte 0x1F and 0x80 in the last rate byte; the reader permutes before each block it squeezes, cursor from 0. finalize_xof_reset copies the padded state before reset. State and reader wiped on drop with the zeroize feature, which cs-identity asks for itself (ml-dsa turns it on too). NIST FIPS 202 examples and CAVP vectors (outputs up to 512 bytes, split reads) run in core/cs-identity/tests/vectors_keccak.rs.
Machine-assisted review of the copy in third_party/rust/ (2026-11-06).
"""

