# cargo-deny policy for the Rust core (this workspace) and the app's FFI crate
# (app/rust, checked with `--config deny.toml`). See docs/supply-chain.md.
#   cargo deny check advisories sources bans
# Licenses are not checked here.

[graph]
# Every platform the app ships on, so a target-specific dependency is not missed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# RustSec database: known vulnerabilities, yanked versions and unsound crates fail.
# Unmaintained crates are reported for direct dependencies only (a transitive one
# has to be replaced upstream first).
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[sources]
# Only crates.io. A git dependency or another registry is a new supply channel and
# must be reviewed (then listed here) before it can be used.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[bans]
multiple-versions = "allow"
# Versions are pinned by the committed Cargo.lock (CI builds with --locked); the
# in-repo crates depend on each other by path, which cargo-deny counts as a wildcard.
wildcards = "allow"
deny = [
    # HTTP / networking stacks: no general-purpose network client anywhere. The app's
    # only network code is cs-net (local sync, Google Drive), on rustls directly.
    { name = "reqwest", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "hyper", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "ureq", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "curl", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "curl-sys", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "isahc", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "surf", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "attohttpc", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "tungstenite", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "tokio-tungstenite", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "quinn", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "socket2", reason = "no HTTP client: cs-net writes its few requests" },
    { name = "mio", reason = "tokio is used without its net/io features" },
    # TLS for Google Drive, used by cs-net and nothing else.
    { name = "rustls", wrappers = ["cs-net"], reason = "TLS only in cs-net (Google Drive)" },
    { name = "native-tls", reason = "TLS only through rustls in cs-net" },
    { name = "openssl", reason = "TLS only through rustls in cs-net" },
    { name = "openssl-sys", reason = "TLS only through rustls in cs-net" },
]
