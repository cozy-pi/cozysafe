# Proof that the Top secret core builds from third_party/rust/ alone: CI builds this with
# an empty CARGO_HOME and --offline (no registry, no cache). It holds nothing but the
# core's crates (docs/supply-chain.md, "Top secret means top secret").
[package]
name = "core-offline"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cs-core = { path = "../../core/cs-core" }
cs-crypto = { path = "../../core/cs-crypto" }
rusqlite = { version = "0.40", features = ["bundled"] }

