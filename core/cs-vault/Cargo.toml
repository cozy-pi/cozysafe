[package]
name = "cs-vault"
version = "0.1.0"
description = "Cozy Safe sync, backups and joining on top of the Top secret core (cs-core)"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cs-core = { path = "../cs-core" }
cs-crypto = { path = "../cs-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cs-crypto = { path = "../cs-crypto", features = ["test-kdf"] }
tempfile = "3"
