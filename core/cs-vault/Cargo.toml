[package]
name = "cs-vault"
version = "0.1.0"
description = "Cozy Safe library and vault storage: create, unlock, lock"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cs-crypto = { path = "../cs-crypto" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
zxcvbn = "3"

# The vault index (docs/adr): SQLite with SQLCipher, the whole file encrypted. Apple
# platforms use CommonCrypto; elsewhere SQLCipher needs OpenSSL's libcrypto, built
# from source and linked statically (only the cipher, HMAC, PBKDF2 and random calls
# it makes stay in the binary; tools/check-rust-symbols proves no socket call does).
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
