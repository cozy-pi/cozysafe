[package]
name = "cs-vault"
version = "0.1.0"
description = "Cozy Safe library and vault storage: create, unlock, lock"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cs-crypto = { path = "../cs-crypto" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"
zxcvbn = "3"

# The vault index (docs/adr/0002): plain SQLite, bundled (compiled from source, no
# system library). Nothing secret is stored in clear: each row's sensitive fields are
# sealed with the vault's keys before they reach SQLite, like 1Password does.
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
cs-crypto = { path = "../cs-crypto", features = ["test-kdf"] }
tempfile = "3"
