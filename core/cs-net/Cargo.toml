[package]
name = "cs-net"
version = "0.1.0"
description = "Cozy Safe network code, all of it: sync with a nearby device (P2P), Google Drive and its sign-in on computers. The only crate allowed to use the network; every connection needs a permit the person granted"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cs-crypto = { path = "../cs-crypto" }
# X-Wing (ML-KEM-768 + X25519) for adding a device (ADR 0010): the vault identity's
# reviewed implementation, no new crate.
cs-identity = { path = "../cs-identity" }
cs-vault = { path = "../cs-vault" }
hex = "0.4"
# Already in the tree (cs-crypto): wipes the password and the words that cross an invite.
zeroize = "1"
serde_json = "1"
# Google Drive over HTTPS: rustls alone (ring for crypto, Mozilla's roots bundled), with
# the few HTTP/1.1 requests written here. A ready-made client (ureq) pulled in 44 crates.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.10"
# Already in the tree (rustls's crypto): SHA-256 for adding a device by an 8-digit code
# (ADR 0003, point 11; the key exchange is X-Wing, above).
ring = { version = "=0.17.14", default-features = false }

[dev-dependencies]
sha2 = "0.11" # already in the tree (cs-vault): the fake Drive lists checksums
cs-crypto = { path = "../cs-crypto", features = ["test-kdf"] }
tempfile = "3"
