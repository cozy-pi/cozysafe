[package]
name = "cs-crypto"
version = "0.1.0"
description = "Cozy Safe cryptographic core: key derivation, key wrapping, streaming encryption"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Tests only: lowers the least accepted Argon2 cost (kdf::KdfParams::ACCEPTED_FLOOR) so
# test libraries open in milliseconds. Enabled from dev-dependencies, never by the app.
test-kdf = []

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.13"
sha2 = "0.11"
# The Top secret core takes audited cryptography and SQLite only (docs/supply-chain.md):
# no error-derive or zeroize-derive macros (they bring syn and quote), no rayon. Argon2
# runs its lanes one after another; on a computer (DESKTOP_FLOOR, p = 4) unlocking takes
# about 0.9 s instead of 0.3 s, and the key is the same (the output is defined by p).
zeroize = "1"
