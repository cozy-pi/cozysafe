[package]
name = "cs-crypto"
version = "0.1.0"
description = "Cozy Safe cryptographic core: key derivation, key wrapping, streaming encryption"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Tests only: lowers the least accepted Argon2 cost (kdf::KdfParams::ACCEPTED_FLOOR) so
# test libraries open in milliseconds. Enabled from dev-dependencies, never by the app.
test-kdf = []

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
hkdf = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

# Computers: run the Argon2 lanes on threads (rayon). DESKTOP_FLOOR has p = 4, which
# otherwise runs its four lanes one after another on one core. The output is defined by
# p, not by the thread count, so keys do not change (test kdf::tests::lanes_on_threads_*).
# Phones use p = 1 and gain nothing, so they do not take the five extra crates.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["parallel"] }
