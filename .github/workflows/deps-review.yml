# Monthly dependency review (docs/dependencies.md, docs/supply-chain.md): opens an issue
# listing what changed since the last review and the packages in tiers 1 and 2.
name: deps-review

on:
  schedule:
    - cron: "23 4 1 * *" # the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/deps-report --issue > "$RUNNER_TEMP/body.md"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Dependency review $(date -u +%Y-%m)" --body-file "$RUNNER_TEMP/body.md"
