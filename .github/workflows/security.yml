name: security

# Independent scanners, besides the project's own checks in ci.yml (docs/supply-chain.md,
# "Independent scanners"). Every tool is pinned to a commit or an exact version released
# at least 14 days before it was added. A finding fails the run; the release waits.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly: new advisories appear without any change here
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Google's OSV database: known vulnerabilities in every locked Rust crate and Dart
  # package (cargo-deny in ci.yml covers Rust only, from RustSec).
  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=app/rust/Cargo.lock
            --lockfile=app/pubspec.lock

  # GitHub's CodeQL on the Rust code and on these workflows.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Upstream crates kept as published for the Top secret core: reviewed and
          # checked byte for byte (tools/check-vendor), not our code to scan.
          config: |
            paths-ignore:
              - third_party/rust
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  # Semgrep's community rules for Rust, Kotlin, Swift, Dart-adjacent config and secrets.
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installed only as pinned: every package and its hash (tools/semgrep-requirements.txt).
      - run: |
          python3 -m venv "$RUNNER_TEMP/sg"
          "$RUNNER_TEMP/sg/bin/pip" install --quiet --require-hashes --no-deps -r tools/semgrep-requirements.txt
      - run: $RUNNER_TEMP/sg/bin/semgrep scan --error --metrics=off --config p/rust --config p/kotlin --config p/swift --config p/secrets --config p/github-actions --exclude target --exclude app/build --exclude third_party/rust .

  # Secrets ever committed, in the whole history (keys, tokens, private keys).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (checksum-verified)
        run: |
          v=8.30.1
          f=gitleaks_${v}_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v$v/$f
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt
          grep " $f\$" gitleaks_${v}_checksums.txt | sha256sum -c -
          tar xzf $f gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # Owners of every crate and publisher of every Dart package, compared with
  # tools/deps/meta.json: a new maintainer is how hijacked releases start (xz). Not on
  # pull requests: it asks crates.io about each crate, one request a second.
  owners:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/deps-report --refresh-owners
      - run: git diff --exit-code tools/deps/meta.json docs/dependencies.md

  # The Top secret core's copies (third_party/rust/) against upstream: an advisory on our
  # version, a yanked version or a sha256 that differs from crates.io stops the run (so
  # every release); newer versions only show up in the report and the weekly issue
  # (vendor-watch.yml).
  vendored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/vendor-watch >> "$GITHUB_STEP_SUMMARY"

  # No crate or package version younger than 14 days: most hijacked releases are found
  # and pulled within days (tools/check-age).
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/check-age
