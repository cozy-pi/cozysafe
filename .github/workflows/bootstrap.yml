# One-off: generate the Flutter + flutter_rust_bridge scaffold on CI (the
# maintainer's machine has no room for the Flutter SDK) and push it to the
# `bootstrap` branch for review. Safe to re-run; it force-pushes that branch.
name: bootstrap

on: workflow_dispatch

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: cargo install flutter_rust_bridge_codegen --locked
      - name: Create Flutter app
        run: flutter create --empty --org com.cozypi --project-name cozysafe --platforms android,ios,macos,windows,linux app
      - name: Integrate flutter_rust_bridge
        working-directory: app
        run: flutter_rust_bridge_codegen integrate
      - name: Record tool versions
        run: |
          {
            echo '# Scaffold tool versions'
            echo
            echo '```'
            flutter --version
            flutter_rust_bridge_codegen --version
            rustc --version
            echo '```'
          } > app/SCAFFOLD.md
      - name: Push to bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b bootstrap
          git add app
          git commit -m "app: Flutter + flutter_rust_bridge scaffold (generated by bootstrap workflow)"
          git push -f origin bootstrap
