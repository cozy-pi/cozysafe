# iOS build uploaded to TestFlight (App Store Connect). Runs on demand.
#
# Signing is manual with the team's Apple Distribution certificate and the
# "Cozy Safe App Store (CI)" profile (IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD,
# IOS_PROFILE_BASE64). Upload uses an App Store Connect API key with the App
# Manager or Admin role (ASC_ADMIN_KEY_ID, ASC_ADMIN_KEY_P8_BASE64, ASC_ISSUER_ID).
# Build number = this workflow's run number, so every run uploads a new build.
name: testflight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (off: only ask Apple to validate the build)"
        type: boolean
        default: true
      version:
        description: "Version name (empty: pubspec)"
        type: string
        default: ""
      build:
        description: "Build number (empty: this run's number)"
        type: string
        default: ""
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: true
      version:
        type: string
        default: ""
      build:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ios:
    # App Store uploads require the Xcode 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false
          shared-key: build
      - run: rustup target add aarch64-apple-ios
      - uses: ./.github/actions/flutter-setup
      - name: Import distribution certificate and profile into a throwaway keychain
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
      # Manual signing for the Runner target only, edited on the runner (not committed):
      # passing it on the command line would also apply to plugin targets, which
      # cannot use an app profile.
      - name: Manual signing for the Runner target
        working-directory: app/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'EOF'
          import os
          p = 'Runner.xcodeproj/project.pbxproj'
          s = open(p).read()
          old = 'PRODUCT_BUNDLE_IDENTIFIER = com.cozypi.cozysafe;'
          assert s.count(old) == 3, s.count(old)   # Debug, Release, Profile of Runner
          s = s.replace(old, old + ' CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = %s; "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"; PROVISIONING_PROFILE_SPECIFIER = "%s";'
                        % (os.environ['TEAM'], os.environ['PROFILE_NAME']))
          open(p, 'w').write(s)
          EOF
      - name: Export options
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.cozypi.cozysafe</key><string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
      - name: Build signed IPA
        working-directory: app
        run: flutter build ipa --release --build-number ${{ inputs.build || github.run_number }} ${{ inputs.version && format('--build-name {0}', inputs.version) || '' }} --dart-define=BUILD_DATE=${{ env.BUILD_DATE }} --dart-define=BUILD_COMMIT=${{ github.sha }} --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - run: mv app/build/ios/ipa/*.ipa CozySafe.ipa
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: CozySafe.ipa

  # The App Store Connect key in a job of its own, never next to the build: only Apple's
  # upload tool runs here. It uploads unless run by hand with upload=false (validate only).
  upload:
    needs: ios
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios
      - name: TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_ADMIN_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_B64: ${{ secrets.ASC_ADMIN_KEY_P8_BASE64 }}
          # Only an explicit upload=false validates. (Checking the event name was wrong: a
          # release is itself started by hand, so 0.1.10 was only validated, not uploaded.)
          ACTION: ${{ inputs.upload == false && '--validate-app' || '--upload-app' }}
        run: |
          set -o pipefail # tee must not hide a failure
          # altool finds the key as ~/.appstoreconnect/private_keys/AuthKey_<id>.p8.
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          trap 'rm -f ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8' EXIT
          xcrun altool $ACTION --type ios --file CozySafe.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER" 2>&1 | tee altool.log
          # A green job must mean the build reached Apple: 0.1.10 went green while only
          # validated. Uploading without altool's success line fails the job, and the run
          # summary says plainly which of the two happened.
          if [ "$ACTION" = --upload-app ]; then
            grep -qE 'UPLOAD SUCCEEDED|No errors uploading' altool.log || { echo "::error::Not uploaded to TestFlight"; exit 1; }
            echo "### TestFlight: uploaded $(ls CozySafe.ipa) — appears in TestFlight after Apple's processing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### TestFlight: validated only, NOT uploaded (upload=false)" >> "$GITHUB_STEP_SUMMARY"
          fi
