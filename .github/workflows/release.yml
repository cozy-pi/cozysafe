# One button for a release: picks the next version name (0.1.0, 0.1.1, …), builds
# every platform with it, and each platform publishes as soon as it is built (no
# platform waits for another):
#   iPhone  → TestFlight (internal testers)
#   Android → Google Play closed test (Alpha)
#   desktop + Android APK → GitHub release vX.Y.Z (safe.cozypi.com links follow it)
#
# The version name is what people see and report ("0.1.7 crashes when…"); the build
# number only has to keep growing for the stores (1000 + this workflow's run number,
# above every build made before this workflow existed).
#
# Run: gh workflow run release.yml -R cozy-pi/cozysafe [-f bump=minor]
# A test build from a branch, for the owner's own devices only (owner 2026-10-31: work in
# progress is tried on a branch before it reaches main):
#   gh workflow run release.yml -R cozy-pi/cozysafe --ref <branch> -f internal_only=true
# TestFlight (internal testers) and Google Play internal testing only: no closed test
# (alpha) and no GitHub release, so the website's download links stay on the last release.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch: 0.1.6 → 0.1.7 · minor: 0.1.6 → 0.2.0"
        type: choice
        options: [patch, minor]
        default: patch
      internal_only:
        description: "Internal testers only (TestFlight, Play internal): no alpha, no GitHub release"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Every independent scanner first (security.yml): a finding stops the release.
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  version:
    needs: security
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          INTERNAL: ${{ inputs.internal_only && 'yes' || '' }}
        run: |
          # Base: the highest vX.Y.Z tag, or used/vX.Y.Z (a name a run took that never
          # became a release: a failed build must not hand its name to the next run;
          # 2026-10-27 three runs were all 0.1.77). First release starts from pubspec's X.Y.
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' 'used/v[0-9]*.[0-9]*.[0-9]*' | sed 's#^used/##; s/^v//' | sort -V | tail -1)
          # pubspec's X.Y is the line being worked on; a newer line starts at X.Y.0.
          base=$(sed -n 's/^version: \([0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          if [ -z "$last" ] || [ "$(printf '%s\n%s\n' "${last%.*}" "$base" | sort -V | tail -1)" != "${last%.*}" ]; then
            name="$base.0"
          else
            IFS=. read -r ma mi pa <<< "$last"
            if [ "$BUMP" = minor ]; then name="$ma.$((mi + 1)).0"; else name="$ma.$mi.$((pa + 1))"; fi
          fi
          # Taken now, whatever happens to this run.
          git tag "used/v$name" "$GITHUB_SHA"
          git push origin "refs/tags/used/v$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "### Cozy Safe $name (build $((1000 + GITHUB_RUN_NUMBER)))${INTERNAL:+, internal testers only}" >> "$GITHUB_STEP_SUMMARY"

  ios:
    needs: version
    uses: ./.github/workflows/testflight.yml
    with:
      upload: true # a release always uploads; never rely on a default here
      version: ${{ needs.version.outputs.name }}
      build: ${{ needs.version.outputs.build }}
    # Only what the iOS job uses (Semgrep: secrets: inherit hands over every secret).
    secrets:
      IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
      IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_ADMIN_KEY_ID: ${{ secrets.ASC_ADMIN_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_ADMIN_KEY_P8_BASE64: ${{ secrets.ASC_ADMIN_KEY_P8_BASE64 }}

  builds:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.name }}
      build: ${{ needs.version.outputs.build }}
      publish: true
      internal_only: ${{ inputs.internal_only }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MACOS_DEVID_P12_BASE64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
      MACOS_DEVID_P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      # Optional (empty when not set: computers then hide Google Drive).
      DRIVE_DESKTOP_CLIENT_ID: ${{ secrets.DRIVE_DESKTOP_CLIENT_ID }}
      DRIVE_DESKTOP_CLIENT_SECRET: ${{ secrets.DRIVE_DESKTOP_CLIENT_SECRET }}
