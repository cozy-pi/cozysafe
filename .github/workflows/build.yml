# Installable builds for every desktop and Android. Runs on demand and on `v*` tags;
# a tag also publishes a GitHub release with all files attached. File names carry
# no version, so https://github.com/cozy-pi/cozysafe/releases/latest/download/<file>
# (used by safe.cozypi.com) always serves the newest release.
#
# Signing: macOS with Developer ID + notarization, Android with the release key.
# Windows is not signed yet (needs a paid code-signing certificate). Every file gets
# a GitHub build-provenance attestation (`gh attestation verify <file> -R cozy-pi/cozysafe`).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # From release.yml: one version name for every platform.
  workflow_call:
    inputs:
      version:
        type: string
        default: ""
      build:
        type: string
        default: ""
      publish:
        type: boolean
        default: false

# Build jobs only read; the release job below asks for what it needs to attest and publish.
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # cargokit builds into Flutter's build tree; cached below
          shared-key: build
      - name: Cache Rust build output (cargokit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/rust_lib_cozysafe
          key: cargokit-android-${{ hashFiles('app/rust/Cargo.lock', 'core/**/*.rs', 'app/rust/src/**/*.rs') }}
          restore-keys: cargokit-android-
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: ./.github/actions/flutter-setup
      # Built with the debug key: the release key is applied in `android-sign`, a job where
      # no Gradle, plugin or package code runs.
      - working-directory: app
        # arm64 only: every current phone; skips building Rust for armv7 and x86_64 (emulators).
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ inputs.build || github.run_number }} ${{ inputs.version && format('--build-name {0}.{1}', inputs.version, inputs.build) || '' }}
      - name: App bundle for Google Play (all ABIs; Play serves each device its own)
        working-directory: app
        run: flutter build appbundle --release --build-number ${{ inputs.build || github.run_number }} ${{ inputs.version && format('--build-name {0}.{1}', inputs.version, inputs.build) || '' }}
      - run: |
          mv app/build/app/outputs/flutter-apk/app-release.apk built-android.apk
          mv app/build/app/outputs/bundle/release/app-release.aab built-android.aab
      # Offline by construction (docs/supply-chain.md): no INTERNET permission after
      # every plugin's manifest is merged, and the shipped Rust library imports no
      # socket functions.
      - name: Check the APK and bundle have no INTERNET permission
        run: tools/check-apk-permissions built-android.apk built-android.aab
      - name: Check the shipped Rust library imports no network functions
        run: |
          unzip -p built-android.apk lib/arm64-v8a/librust_lib_cozysafe.so > "$RUNNER_TEMP/librust_lib_cozysafe.so"
          NM=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm 2>/dev/null | sort -V | tail -1 || true)
          NM="${NM:-nm}" tools/check-rust-symbols "$RUNNER_TEMP/librust_lib_cozysafe.so"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-built
          path: |
            built-android.apk
            built-android.aab

  # The release key in a job of its own: only the Android SDK's apksigner and the JDK's
  # jarsigner run here, never Gradle, Flutter plugins or package code.
  android-sign:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-built
      - name: Sign the APK and the Play bundle with the release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_B64" | base64 --decode > "$KS"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # apksigner replaces the debug signature (v1, v2, v3) with the release key's.
          "$APKSIGNER" sign --ks "$KS" --ks-type pkcs12 --ks-key-alias cozysafe \
            --ks-pass env:KS_PW --key-pass env:KS_PW --out CozySafe-android.apk built-android.apk
          # A bundle is a JAR-signed zip: drop the debug signature, then sign it again.
          cp built-android.aab CozySafe-android-play.aab
          zip -q -d CozySafe-android-play.aab 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$KS" -storetype pkcs12 -storepass:env KS_PW -keypass:env KS_PW \
            CozySafe-android-play.aab cozysafe
          rm "$KS"
      - name: Check both carry the release key, and only it
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs CozySafe-android.apk | tee /dev/stderr | grep -q "CN=Cozy Pi"
          ! "$APKSIGNER" verify --print-certs CozySafe-android.apk | grep -qi "CN=Android Debug"
          keytool -printcert -jarfile CozySafe-android-play.aab | tee /dev/stderr | grep -q "CN=Cozy Pi"
          ! keytool -printcert -jarfile CozySafe-android-play.aab | grep -qi "CN=Android Debug"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            CozySafe-android.apk
            CozySafe-android-play.aab

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # cargokit builds into Flutter's build tree; cached below
          shared-key: build
      - name: Cache Rust build output (cargokit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/linux/x64/release/plugins/rust_lib_cozysafe/cargokit_build
          key: cargokit-linux-${{ hashFiles('app/rust/Cargo.lock', 'core/**/*.rs', 'app/rust/src/**/*.rs') }}
          restore-keys: cargokit-linux-
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - uses: ./.github/actions/flutter-setup
      - working-directory: app
        run: flutter build linux --release ${{ inputs.version && format('--build-name {0} --build-number {1}', inputs.version, inputs.build) || '' }}
      - run: tar -C app/build/linux/x64/release/bundle -czf CozySafe-linux-x64.tar.gz .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: CozySafe-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # cargokit builds into Flutter's build tree; cached below
          shared-key: build
      - name: Cache Rust build output (cargokit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/windows/x64/plugins/rust_lib_cozysafe/cargokit_build
          key: cargokit-windows-${{ hashFiles('app/rust/Cargo.lock', 'core/**/*.rs', 'app/rust/src/**/*.rs') }}
          restore-keys: cargokit-windows-
      - uses: ./.github/actions/flutter-setup
      - working-directory: app
        run: flutter build windows --release ${{ inputs.version && format('--build-name {0} --build-number {1}', inputs.version, inputs.build) || '' }}
      - shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath CozySafe-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: CozySafe-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: false # cargokit builds into Flutter's build tree; cached below
          shared-key: build
      - name: Cache Rust build output (cargokit)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_cozysafe.build
          key: cargokit-macos-${{ hashFiles('app/rust/Cargo.lock', 'core/**/*.rs', 'app/rust/src/**/*.rs') }}
          restore-keys: cargokit-macos-
      - uses: ./.github/actions/flutter-setup
      - name: Release entitlements keep the sandbox and grant no network access
        run: tools/check-entitlements
      - working-directory: app
        run: flutter build macos --release ${{ inputs.version && format('--build-name {0} --build-number {1}', inputs.version, inputs.build) || '' }}
      # The app is built ad-hoc signed (CODE_SIGN_IDENTITY "-"): no certificate on this
      # machine while Flutter, CocoaPods and every package's build code run.
      - name: Hand the built app to the signing job (ditto keeps symlinks and permissions)
        run: ditto -c -k --keepParent "app/build/macos/Build/Products/Release/Cozy Safe.app" built-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-built
          path: built-macos.zip

  # Developer ID signing in a job of its own: the certificate never sits next to the build.
  # Only Apple's tools run here.
  macos-sign:
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: app/macos/Runner/Release.entitlements
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-built
      - run: |
          mkdir -p app/build/macos/Build/Products/Release
          ditto -x -k built-macos.zip app/build/macos/Build/Products/Release
      - name: Import Developer ID certificate into a throwaway keychain
        env:
          P12_B64: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/devid.p12"
          # Sign by hash: the certificate name contains non-ASCII letters.
          ID=$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$ID"
          echo "IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Sign app (hardened runtime, inside-out)
        run: |
          APP="app/build/macos/Build/Products/Release/Cozy Safe.app"
          # Nested code first (frameworks, dylibs), then the app with its entitlements.
          find "$APP/Contents/Frameworks" -depth \( -name "*.framework" -o -name "*.dylib" \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime --sign "$IDENTITY" "{}"
          codesign --force --timestamp --options runtime \
            --entitlements app/macos/Runner/Release.entitlements --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Disk image, signed
        run: |
          hdiutil create -volname "Cozy Safe" -srcfolder "app/build/macos/Build/Products/Release/Cozy Safe.app" -ov -format UDZO signed-macos.dmg
          codesign --force --timestamp --sign "$IDENTITY" signed-macos.dmg
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed
          path: signed-macos.dmg

  # Notarization in a job of its own: the App Store Connect key never sits next to the
  # build or the signing certificate. Only Apple's tools run here.
  macos-notarize:
    needs: macos-sign
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed
      - name: Notarize and staple the disk image
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          DMG="CozySafe-macos.dmg"
          mv signed-macos.dmg "$DMG"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          # Submit, then poll ourselves: `--wait` dies on the first network blip
          # (seen: "The Internet connection appears to be offline" after an hour).
          SUB=$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "Submission $SUB"
          STATUS=""
          for i in $(seq 1 360); do   # 360 × 30 s = 3 h
            STATUS=$(xcrun notarytool info "$SUB" "${AUTH[@]}" --output-format json 2>/dev/null |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' 2>/dev/null || echo "unreachable")
            echo "$(date -u +%H:%M:%S) $STATUS"
            case "$STATUS" in Accepted|Invalid|Rejected) break ;; esac
            sleep 30
          done
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUB" "${AUTH[@]}" || true
            exit 1
          fi
          rm "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: CozySafe-macos.dmg

  # Google Play as soon as Android is built (no platform waits for another), in a job of
  # its own: the Play key never sits next to Gradle, Flutter plugins or any package's code.
  play:
    if: inputs.publish
    needs: android-sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
      - name: Google Play, internal testing (no review, testers have it within minutes)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cozypi.cozysafe
          releaseFiles: CozySafe-android-play.aab
          # Same as the app's Android version name: 0.1.4.1009.
          releaseName: ${{ inputs.version }}.${{ inputs.build }}
          track: internal
          status: completed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          path: src
      - name: Google Play, the same build into closed testing (alpha, reviewed by Google)
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          node src/tools/play-track.mjs "$RUNNER_TEMP/sa.json" "${{ inputs.build }}" alpha
          rm -f "$RUNNER_TEMP/sa.json"

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    needs: [android-sign, linux, windows, macos-notarize]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - run: rm -f CozySafe-*.aab && sha256sum CozySafe-* > SHA256SUMS.txt   # the .aab is for Google Play only
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: CozySafe-*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}"
          gh release create "$TAG" CozySafe-* SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cozy Safe $TAG (preview)" \
            --notes "Preview build for testing. macOS: signed with Developer ID and notarized by Apple. Android: signed with the Cozy Pi release key (SHA-256 D0:82:E9:7B:D2:93:E3:CB:69:4D:66:69:A2:82:AD:E1:1E:6F:1C:1E:04:B8:4C:48:AA:07:BA:32:AF:C2:9D:A4); allow installing from this source. Windows: not signed yet, choose More info → Run anyway. Every file has a build-provenance attestation: gh attestation verify <file> -R cozy-pi/cozysafe. What changed: https://github.com/cozy-pi/cozysafe/blob/main/CHANGELOG.md"
